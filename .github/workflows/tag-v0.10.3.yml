name: Tag Terax v0.10.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tag-v0.10.3.yml"

permissions:
  contents: write
  actions: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create v0.10.3 tag
        shell: bash
        run: |
          set -euo pipefail
          # Repoint the failed, release-less tag to the current default-branch
          # commit so GitHub's GITHUB_TOKEN may create the release.
          git tag -f v0.10.3 "$GITHUB_SHA"
          git push --force origin refs/tags/v0.10.3
      - name: Start release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref v0.10.3
