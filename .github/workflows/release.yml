name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs only build Linux workflow artifacts; publishing requires a tag push.
  workflow_dispatch:

jobs:
  publish-tauri:
    outputs:
      app-version: ${{ steps.tauri.outputs.appVersion }}
    permissions:
      actions: read
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      # Linux-only releases. The macOS and Windows legs are intentionally not
      # built; the platform-conditional steps below are kept so re-adding an
      # entry here is all it takes to bring a platform back.
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            rust-target: x86_64-unknown-linux-gnu
            appimage-arch: x86_64
            deb-arch: amd64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            rpm

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Write Apple API key to disk
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          KEY_CONTENT: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$KEY_CONTENT" > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERAX_CLI_TARGET: ${{ matrix.rust-target }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: ${{ github.event_name == 'push' && format('Terax {0}', github.ref_name) || '' }}
          releaseBody: "See the assets to download and install. Auto-update is built in."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Strip the bundled libwayland-* libs from the AppImage so it loads the
      # host copies at runtime. The Ubuntu 22.04 build host ships libwayland
      # 1.20, but recent Mesa (Fedora 43 / Arch / Bazzite, Mesa 1.22+) needs
      # newer symbols; AppImage puts its bundled libs first on the search path,
      # so the stale copy wins and EGL fails with EGL_BAD_PARAMETER. libgdk-3
      # hard-links these three, so removing them only redirects resolution to
      # the host copy, which every GTK-capable system has. They are on the
      # AppImage excludelist for this exact reason. The re-signed AppImage and
      # its .sig are re-uploaded here; the updater manifest is patched in the
      # patch-updater-manifest job after all matrix legs finish, so a parallel
      # macOS/Windows upload cannot clobber the combined latest.json.
      - name: Fix AppImage wayland libs and re-sign
        if: runner.os == 'Linux'
        env:
          APPIMAGE_ARCH: ${{ matrix.appimage-arch }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          BASENAME=$(basename "$APPIMAGE")
          echo "Patching: $APPIMAGE"

          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/"
          pushd "$WORK" >/dev/null
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null

          test -x squashfs-root/usr/bin/terax \
            || { echo "terax binary missing from AppImage"; exit 1; }

          # linuxdeploy may already exclude some of these libraries.
          find squashfs-root \( -type f -o -type l \) \
            -name 'libwayland-*.so*' -print -delete

          curl -fsSL -o appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${APPIMAGE_ARCH}.AppImage"
          chmod +x appimagetool.AppImage
          ARCH="$APPIMAGE_ARCH" ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$BASENAME"

          # Sanity-check the repacked image before it replaces the original.
          rm -rf squashfs-root
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null
          if find squashfs-root -name 'libwayland-*.so*' -print -quit | grep -q .; then
            echo "Wayland library still present after repack"
            exit 1
          fi
          test -x squashfs-root/usr/bin/terax \
            || { echo "terax binary missing from repacked AppImage"; exit 1; }
          squashfs-root/usr/bin/terax-cli --help
          popd >/dev/null

          cp "$WORK/$BASENAME" "$APPIMAGE"

          rm -f "$APPIMAGE.sig"
          pnpm tauri signer sign "$APPIMAGE"

      - name: Verify Linux packages and stage artifacts
        if: runner.os == 'Linux'
        env:
          APPIMAGE_ARCH: ${{ matrix.appimage-arch }}
          DEB_ARCH: ${{ matrix.deb-arch }}
        run: |
          set -euo pipefail
          mkdir linux-packages
          for package in src-tauri/target/release/bundle/{deb/*.deb,rpm/*.rpm,appimage/*.AppImage}; do
            test -s "$package"
            test -s "$package.sig"
            cp "$package" "$package.sig" linux-packages/
          done
          test "$(dpkg-deb -f linux-packages/*.deb Architecture)" = "$DEB_ARCH"
          test "$(rpm -qp --queryformat '%{ARCH}' linux-packages/*.rpm)" = "$APPIMAGE_ARCH"
          dpkg-deb -x linux-packages/*.deb unpacked-deb
          unpacked-deb/usr/bin/terax-cli --help
          file unpacked-deb/usr/bin/terax unpacked-deb/usr/bin/terax-cli
          (cd linux-packages && sha256sum * > SHA256SUMS)
          stat --printf='%n %s bytes\n' linux-packages/* >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Linux workflow artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.appimage-arch }}-packages
          path: linux-packages/
          if-no-files-found: error

      - name: Upload re-signed AppImage to release
        if: runner.os == 'Linux' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" linux-packages/*.AppImage linux-packages/*.AppImage.sig \
            --clobber --repo "$GITHUB_REPOSITORY"

      # SignPath Authenticode-signs the Windows installers. Their bytes change,
      # so the minisign updater signatures tauri-action produced over the
      # unsigned files no longer match. We stage the installers under the exact
      # names the SignPath artifact configuration expects, submit them, then
      # re-run the tauri signer over the SIGNED files and re-upload both the
      # installers and their new .sig. latest.json is patched in the final
      # patch-updater-manifest job, after every matrix leg has merged, so a
      # parallel macOS/Linux upload cannot clobber the Windows signatures.
      - name: Stage Windows installers for SignPath
        if: matrix.platform == 'windows-latest' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleDir = "src-tauri/target/release/bundle"
          $exe = Get-ChildItem "$bundleDir/nsis" -Filter *.exe | Select-Object -First 1
          $msi = Get-ChildItem "$bundleDir/msi"  -Filter *.msi | Select-Object -First 1
          if (-not $exe) { throw "No NSIS .exe produced by Tauri" }
          if (-not $msi) { throw "No .msi produced by Tauri" }
          New-Item -ItemType Directory -Path signpath-staging -Force | Out-Null
          Copy-Item $exe.FullName signpath-staging/terax-setup.exe
          Copy-Item $msi.FullName signpath-staging/terax.msi
          "EXE_REAL_PATH=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append
          "MSI_REAL_PATH=$($msi.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Upload unsigned Windows artifact
        id: upload-windows
        if: matrix.platform == 'windows-latest' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: signpath-staging/
          if-no-files-found: error

      # Requires manual approval in the SignPath UI for the production policy.
      # The default wait timeout is 600s; bumped so the job survives the time
      # it takes to review and approve the request during a release.
      - name: Submit Windows installers to SignPath
        if: matrix.platform == 'windows-latest' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 'df665bf4-9b76-41ae-9596-1ba3a23010aa'
          project-slug: 'terax-ai'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'initial'
          github-artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: 'signed'

      - name: Re-sign updater and upload signed Windows installers
        if: matrix.platform == 'windows-latest' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $signedExe = "signed/terax-setup.exe"
          $signedMsi = "signed/terax.msi"
          foreach ($f in @($signedExe, $signedMsi)) {
            if (-not (Test-Path $f)) { throw "Signed artifact missing: $f" }
            $sig = Get-AuthenticodeSignature $f
            if ($null -eq $sig.SignerCertificate) { throw "$f is NOT Authenticode-signed" }
            if ($sig.Status -ne 'Valid') { throw "$f signature status: $($sig.Status)" }
            Write-Host "OK $f -> $($sig.SignerCertificate.Subject)"
          }
          Copy-Item $signedExe $env:EXE_REAL_PATH -Force
          Copy-Item $signedMsi $env:MSI_REAL_PATH -Force
          Remove-Item "$($env:EXE_REAL_PATH).sig" -ErrorAction SilentlyContinue
          Remove-Item "$($env:MSI_REAL_PATH).sig" -ErrorAction SilentlyContinue
          pnpm tauri signer sign $env:EXE_REAL_PATH
          pnpm tauri signer sign $env:MSI_REAL_PATH
          gh release upload $env:GITHUB_REF_NAME `
            $env:EXE_REAL_PATH "$($env:EXE_REAL_PATH).sig" `
            $env:MSI_REAL_PATH "$($env:MSI_REAL_PATH).sig" `
            --clobber --repo $env:GITHUB_REPOSITORY

  # Patch the re-signed AppImage signature into the updater manifest. Runs
  # once, after the matrix leg has merged its platform into latest.json, so it
  # operates on the full manifest and cannot be clobbered by a parallel upload.
  # Releases are Linux-only, so only the linux keys are patched here.
  patch-updater-manifest:
    needs: publish-tauri
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Patch latest.json with the re-signed AppImage signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.publish-tauri.outputs.app-version }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "latest.json" \
            --pattern "*_amd64.AppImage.sig" --clobber

          APP_SIG=$(cat ./*_amd64.AppImage.sig)

          # Re-signing an artifact re-uploads it with --clobber, which deletes
          # and recreates the asset under a new id. tauri-action baked the old
          # asset-id API urls into latest.json, so we also rewrite the url of
          # the re-signed artifact to the tag+filename download url, which is
          # stable across clobbers. The filename comes from the .sig name.
          APP_FILE=$(basename "$(ls ./*_amd64.AppImage.sig)" .sig)
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          jq -e 'has("platforms") and (.platforms | has("linux-x86_64"))' \
            latest.json >/dev/null \
            || { echo "latest.json missing an expected platform key"; exit 1; }

          jq --arg app "$APP_SIG" --arg appurl "$DL/$APP_FILE" '
            .platforms["linux-x86_64"] += {signature: $app, url: $appurl}
            | (if .platforms["linux-x86_64-appimage"]
               then .platforms["linux-x86_64-appimage"] += {signature: $app, url: $appurl}
               else . end)
          ' latest.json > latest.json.tmp
          mv latest.json.tmp latest.json

          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
