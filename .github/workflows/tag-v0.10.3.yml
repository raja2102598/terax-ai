name: Publish Terax v0.10.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tag-v0.10.3.yml"

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish v0.10.3
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git tag -f v0.10.3 "$GITHUB_SHA"
          git push --force origin refs/tags/v0.10.3
          gh release edit v0.10.3 \
            --draft=false \
            --latest \
            --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY"
