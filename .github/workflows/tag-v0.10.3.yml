name: Tag Terax v0.10.3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tag-v0.10.3.yml"

permissions:
  contents: write

jobs:
  tag-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create v0.10.3 tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.10.3 >/dev/null 2>&1; then
            echo "v0.10.3 already exists"
            exit 0
          fi
          git tag v0.10.3 "$GITHUB_SHA"
          git push origin v0.10.3
