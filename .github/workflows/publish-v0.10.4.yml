name: Publish Terax v0.10.4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.10.4.yml"

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish v0.10.4
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git tag -f v0.10.4 "$GITHUB_SHA"
          git push --force origin refs/tags/v0.10.4
          cat > release-notes.md <<'EOF'
          ## What's new

          - Added a fast terminal scrollbar with visibility preferences
          - Added command-block markers and output actions
          - Added shortcuts to copy the full terminal, copy/select block output, and jump to top or live output
          - Improved terminal navigation and scrollback controls

          ## Downloads

          - Linux: AppImage, Debian package, and RPM
          - Windows: EXE installer and MSI package
          - macOS builds are unavailable while Apple signing credentials are being repaired
          EOF
          gh release edit v0.10.4 \
            --draft=false \
            --latest \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY"
